<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2B4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A&amp;K Portal">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Anchor &amp; Key Portal</title>
<style>
:root{--navy:#0D2B4E;--brass:#B8973A;--bg:#EEF2F7;--card:#fff;--text:#17212F;--muted:#5A6779;--border:#CBD5E3;--red:#B42318;--green:#157347;--orange:#B54708;--note:#FBF6E6;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI","Helvetica Neue",Arial,sans-serif}
[hidden]{display:none!important}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:1px}

/* sign in */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--navy)}
.login-card{background:var(--card);border-radius:14px;padding:26px 22px;width:100%;max-width:380px}
.login-card img{display:block;width:120px;margin:0 auto 10px}
.login-card h1{font-size:22px;text-align:center;color:var(--navy)}
.login-card .slogan{text-align:center;font-family:Georgia,serif;font-style:italic;color:var(--brass);margin:4px 0 18px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:8px 0 0}

/* header + tabs */
.sticky{position:sticky;top:0;z-index:50;background:var(--navy);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff}
.top img{width:44px;height:auto;background:#fff;border-radius:8px;padding:3px}
.top .t1{font-weight:700;font-size:16px;line-height:1.1}
.top .t2{font-family:Georgia,serif;font-style:italic;color:#E3C46B;font-size:12px}
.top .sp{flex:1}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;min-height:40px;padding:0 10px;cursor:pointer;font-size:14px;white-space:nowrap}
.tabs{display:flex;overflow-x:auto;gap:2px;padding:0 8px;border-bottom:3px solid var(--brass);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;background:none;border:0;color:#B9C6D8;padding:12px 12px;font-weight:600;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.tab-btn.on{color:#fff;border-bottom-color:#fff}
.pill{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;text-align:center;margin-left:4px}

main{max-width:900px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom,0px))}
.banner{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.banner .sl{font-family:Georgia,serif;font-style:italic;color:#E3C46B;font-size:17px}
.banner .co{background:var(--brass);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:600px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--navy)}
.stat span{color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h2{font-size:18px;color:var(--navy);margin-bottom:8px}
.empty{color:var(--muted);font-size:14px}

.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.toolbar input[type=search]{grid-column:1/-1}
.toolbar .btn{grid-column:1/-1}
@media(min-width:640px){.toolbar{grid-template-columns:2fr 1fr 1fr auto}.toolbar input[type=search]{grid-column:auto}.toolbar .btn{grid-column:auto}}
.count{color:var(--muted);font-size:13px;margin:0 2px 8px}

input,select,textarea{width:100%;background:#fff;color:var(--text);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;min-height:46px;font-size:16px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin:0 0 4px}
.req{color:var(--red)}
.form{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.form{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;min-height:44px;padding:0 16px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.gold{background:var(--brass)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn[disabled]{opacity:.55}

.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item-title{font-weight:700;color:var(--navy);overflow-wrap:anywhere}
.item-sub{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:14px}
.item .note{color:var(--muted);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.warn{color:var(--orange);font-weight:600}
.badge{display:inline-block;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:700;background:#E4E9F1;color:#38475C}
.badge.g{background:#DCF3E6;color:#0F5C36}.badge.r{background:#FBE0DD;color:#8E1B10}.badge.o{background:#FCE9D2;color:#8A3B05}.badge.b{background:#DCE8FA;color:#14418A}.badge.y{background:#F6ECC6;color:#6F5412}
.prio-Urgent{border-left:5px solid var(--red)}.prio-Medium{border-left:5px solid var(--orange)}.prio-Low{border-left:5px solid var(--green)}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photos img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:#E4E9F1}

.overlay{position:fixed;inset:0;background:rgba(8,20,38,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center;padding:20px}}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.modal{border-radius:16px}}
.modal h2{font-size:20px;color:var(--navy);margin-bottom:12px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kv{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:12px}
.kv td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
.kv td:first-child{color:var(--muted);width:40%}
.kv-h{font-family:Georgia,serif;font-weight:700;color:var(--navy);margin:14px 0 4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:200;max-width:90vw;transition:transform .25s;font-size:15px}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--red)}#toast.good{background:var(--green)}
.send-box{background:var(--navy);color:#fff;border-radius:12px;padding:16px;margin-bottom:14px}
.send-box label{color:#D6DEEA}
.send-box h2{color:#fff}
.send-box p{color:#D6DEEA;margin:4px 0 12px;font-size:14px}
.send-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
@media(min-width:560px){.send-actions{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

const SESSION_KEY = "ak_session_v1";
let session = null;

function saveSession(s) { session = s; try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch (e) {} }

async function authRequest(path, body) {
  const r = await fetch(SUPABASE_URL + "/auth/v1/" + path, { method: "POST", headers: { apikey: ANON_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ("Sign in failed (" + r.status + ")"));
  return j;
}
function toSession(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: j.user && j.user.email }; }
async function login(email, pw) { saveSession(toSession(await authRequest("token?grant_type=password", { email, password: pw }))); }
async function refreshSession() {
  if (!session) throw new Error("Signed out");
  try { const s = toSession(await authRequest("token?grant_type=refresh_token", { refresh_token: session.refresh_token })); if (!s.email) s.email = session.email; saveSession(s); }
  catch (e) { saveSession(null); throw new Error("Your session expired. Please sign in again."); }
}
async function accessToken() {
  if (!session) throw new Error("Signed out");
  if (session.expires_at - Date.now() / 1000 < 60) await refreshSession();
  return session.access_token;
}
async function rest(method, path, body, extra) {
  const t = await accessToken();
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method, headers: Object.assign({ apikey: ANON_KEY, Authorization: "Bearer " + t, "Content-Type": "application/json" }, extra || {}),
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  const text = await r.text(); let j = null; try { j = text ? JSON.parse(text) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.message || j.hint || j.details)) || ("Request failed (" + r.status + ")"));
  return j;
}

}
const signedCache = new Map();
async function signedUrl(path) {
  if (signedCache.has(path)) return signedCache.get(path);
  const t = await accessToken();
  const r = await fetch(SUPABASE_URL + "/storage/v1/object/sign/" + BUCKET + "/" + encPath(path), {
    method: "POST", headers: { apikey: ANON_KEY, Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: JSON.stringify({ expiresIn: 3600 })
  });
  const j = await r.json().catch(() => ({}));

  const u = j.signedURL.startsWith("/storage/v1") ? SUPABASE_URL + j.signedURL : SUPABASE_URL + "/storage/v1" + j.signedURL;
  signedCache.set(path, u);
  return u;
}

async function hydratePhotos() {
  const imgs = document.querySelectorAll("img[data-path]:not([src])");
  for (const img of imgs) {
    try { const u = await signedUrl(img.dataset.path); img.src = u; if (img.parentElement.tagName === "A") img.parentElement.href = u; } catch (e) { img.alt = "Photo unavailable"; }
  }
}

async function compressImage(file) {
  try {
    const bmp = await createImageBitmap(file), sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return (await new Promise(r => c.toBlob(r, "image/jpeg", 0.8))) || file;
  } catch (e) { return file; }
}

document.addEventListener("input", ev => { const m = /^(q|s|b)-(.+)$/.exec(ev.target.id || ""); if (m && LIST[m[2]]) renderList(m[2]); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#overlay").hidden) closeModal(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && session && !$("#app").hidden) loadTables(["applications"]).then(() => { updatePills(); render(); }).catch(() => {}); });

/* ---------- sign in / start ---------- */
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault(); const err = $("#li-err"), btn = $("#li-btn"); err.textContent = ""; btn.disabled = true; btn.textContent = "Signing in";
  try { await login($("#li-email").value.trim(), $("#li-pass").value); try { localStorage.setItem("ak_email", $("#li-email").value.trim()); } catch (e) {} await start(); }
  catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = "Sign in"; }
});
async function start() {
  $("#login").hidden = true; $("#app").hidden = false; buildShell(); show("dashboard");
  try { await loadAll(); } catch (e) { toast(e.message, "bad"); if (!session) { location.reload(); } }
  clearInterval(start._t); start._t = setInterval(() => { if (!document.hidden && session) loadTables(["applications"]).then(() => { updatePills(); if (currentTab === "applications" || currentTab === "dashboard") render(); }).catch(() => {}); }, 60000);
}
(async function boot() {
  let saved = ""; try { saved = localStorage.getItem("ak_email") || ""; } catch (e) {}
  $("#li-email").value = saved || "info@anchorkey.co.za";
  if (session) { try { await accessToken(); await start(); return; } catch (e) { saveSession(null); } }
  $("#login").hidden = false;
})();
</script>
</body>
</html>
